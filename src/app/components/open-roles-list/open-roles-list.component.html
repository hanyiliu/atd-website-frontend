<div class="container">
    <div class="header-container">
        <div class="header-title">Open Roles</div>
        <img
            src="icons/open-roles-icon.svg"
            alt="Open Roles Icon"
            class="icon"
        />
    </div>

    <!-- No-link roles section (plain text, no anchor, no underline hover) -->
    <div class="open-roles-list no-link">
        <div class="open-role role-no-link" *ngFor="let role of noLinkRoles">
            <div class="role-title">{{ role.title }}</div>
        </div>
        <div class="no-roles" *ngIf="noLinkRoles.length === 0">
            No Current Job Openings
        </div>
    </div>

    <!-- Link roles section (clickable, underline animation handled via CSS) -->
    <div class="open-roles-list link">
        <div class="open-role" *ngFor="let role of linkRoles">
            <a [href]="role.link" target="_blank" rel="noopener noreferrer" class="role-link">
                <div class="role-title">{{ role.title }}</div>
                <mat-icon class="role-arrow-icon">chevron_right</mat-icon>
            </a>
        </div>
    </div>
</div>
