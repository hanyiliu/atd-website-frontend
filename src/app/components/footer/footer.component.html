<div class="footer">
  <div class="container">
    <div class="title">
      <p class="header">
        All Things<br />
        Design
      </p>
    </div>
    <div class="link-list">
      <a
        *ngFor="let link of navLinks"
        class="link"
        [routerLink]="link.route"
        [fragment]="link.fragment"
      >
        {{ link.label }}
      </a>
    </div>
    <div class="contact-section">
      <p class="header">Have a Project for Us?</p>
      <p class="contact-des">
        We help businesses and orgs stay modern in the new age.
      </p>
      <div></div>
      <a
        [href]="'mailto:' + contactEmail + '?subject=' + contactSubject"
        class="contact-button"
      >
        Contact Us
      </a>
    </div>
  </div>
  <div class="footer-bottom">
    <p class="copyright">©All Things Design. All Rights Reserved.</p>
    <div class="credit">
      <span>Site by </span>
      <a
        class="name-link"
        href="https://www.linkedin.com/in/hanyiliu/"
        target="_blank"
        >Hanyi Liu</a
      >
      <span> | </span>
      <a
        class="name-link"
        href="https://www.linkedin.com/in/cody-chen-05b379303/"
        target="_blank"
        >Cody Chen</a
      >
      <span> | </span>
      <a
        class="name-link"
        href="https://www.linkedin.com/in/sanjithiype/"
        target="_blank"
        >Sanjith Iype</a
      >
    </div>
    <div class="social-icons">
      <a [href]="instagramUrl" aria-label="Instagram">
        <img src="icons/instagram.svg" alt="Insta" />
      </a>
      <a [href]="linkedinUrl" aria-label="LinkedIn">
        <img src="icons/linkedin.svg" alt="LinkedIn" />
      </a>
      <a [href]="tiktokUrl" aria-label="TikTok">
        <img src="icons/tiktok.svg" alt="Tiktok" />
      </a>
    </div>
  </div>
</div>
