<div class="contact-box">
  <div class="logo-box">
    <img src="icons/mail.svg" alt="Mail Icon" width="120" aspectRatio="1" />
  </div>
  <div class="title-box">
    <div class="left-dot">
      <img src="icons/pink-dot.svg" alt="Design" width="16" height="16" />
    </div>
    <div class="title">Get In Touch</div>
    <div class="right-dot">
      <img src="icons/pink-dot.svg" alt="Design" width="16" height="16" />
    </div>
  </div>
  <div class="description-box">
    <div class="description">
      Connect with us to learn more about our events
    </div>
    <div class="description2">and news!</div>
  </div>
  <div class="input-wrapper">
    <div class="input-row">
      <input
        type="email"
        placeholder="Enter Your Email"
        [(ngModel)]="email"
        (keyup.enter)="onSubmit()"
        autocomplete="off"
      />
      <button (click)="onSubmit()">
        <img src="icons/submit.svg" alt="Send Icon" width="24" height="24" />
      </button>
    </div>

    <div
      *ngIf="statusMessage && !loading"
      [ngClass]="statusClass"
      class="status-box"
    >
      {{ statusMessage }}
    </div>

    <div *ngIf="loading && !statusMessage" class="loading-spinner">
      <img src="icons/spinner.svg" alt="Loading..." width="24" height="24" />
    </div>
  </div>
</div>
