<div class="container">
  <div class="header-container">
    <div class="header-title">Recent Projects</div>
  </div>
  <div class="projects-list">
    <a
      [href]="project.link"
      target="_blank"
      rel="noopener noreferrer"
      class="project-link"
      *ngFor="let project of projects"
    >
      <div class="project">
        <div class="project-image-container">
          <img
            [src]="project.image"
            alt="{{ project.alt }}"
            class="project-image"
          />
          <div class="overlay">
            <span class="project-title">{{ project.alt }}</span>
          </div>
        </div>
      </div>
    </a>
    <div class="no-projects" *ngIf="projects.length === 0">
      No Recent Projects
    </div>
  </div>
</div>
