<!-- Loading overlay for first-time visit -->
<div *ngIf="showLoadingOverlay" class="loading-overlay" [class.fade-out]="isLoadingFadingOut">
  <app-loading-indicator></app-loading-indicator>
</div>

<!-- Main application content -->
<div id="main-container" class="app-container">
  <app-navbar></app-navbar>
  <div class="router-wrapper" [@routeTransition]="route.snapshot.data">
    <router-outlet></router-outlet>
  </div>
  <app-footer></app-footer>
</div>
